name: Quality

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Tests and compile checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install Pipenv
        run: python -m pip install --upgrade pipenv

      - name: Install dependencies
        run: pipenv verify && pipenv sync --dev

      - name: Install legacy Office converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc

      - name: Run unit tests
        run: pipenv run python -m unittest discover -s tests

      - name: Offline evaluation controls (live answers are reported as skipped)
        run: pipenv run python eval_harness.py --mock --out output/evaluation-mock

      - name: Compile checked modules
        run: >
          pipenv run python -m py_compile
          main.py
          components/page_state.py
          components/tabs/settings.py
          utils/browser_settings.py
          utils/ollama.py

  lint:
    name: Static warning checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Run Ruff
        run: ruff check . --select E9,F63,F7,F82

  container-smoke:
    name: Read-only container startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and start local image
        run: docker compose -p docmind-test up --build -d --wait --wait-timeout 180
      - name: Exercise application startup without a model server
        run: |
          docker compose -p docmind-test exec -T docmind python < scripts/check_container.py
      - name: Show container logs
        if: failure()
        run: docker compose -p docmind-test logs
      - name: Stop test container
        if: always()
        run: docker compose -p docmind-test down

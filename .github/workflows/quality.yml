name: Quality

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  react-build:
    name: React production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  test:
    name: Tests and compile checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install Pipenv
        run: python -m pip install --upgrade pipenv

      - name: Install dependencies
        run: pipenv verify && pipenv sync --dev

      - name: Install legacy Office converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc

      - name: Install type checker and coverage
        run: pipenv run python -m pip install pyright==1.1.414 coverage==7.17.3

      - name: Run unit tests with coverage
        run: pipenv run coverage run -m unittest discover -s tests

      - name: Offline evaluation controls (live answers are reported as skipped)
        run: pipenv run coverage run -a eval_harness.py --mock --out output/evaluation-mock

      - name: Coverage (fails below 85% of statements and branches)
        run: pipenv run coverage report --fail-under=85

      - name: Type check (pyright, basic mode)
        run: pipenv run pyright

      - name: Compile all modules
        run: pipenv run python -m compileall -q backend utils evaluation

  lint:
    name: Static warning checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.2

      - name: Run Ruff
        run: ruff check .

  container-smoke:
    name: Read-only container startup
    runs-on: ubuntu-latest
    env:
      DOCMIND_CPUS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and start local image
        run: docker compose -p docmind-test up --build -d --wait --wait-timeout 180
      - name: Exercise application startup without a model server
        run: |
          docker compose -p docmind-test exec -T docmind python < scripts/check_container.py
      - name: Show container logs
        if: failure()
        run: docker compose -p docmind-test logs
      - name: Stop test container
        if: always()
        run: docker compose -p docmind-test down -v

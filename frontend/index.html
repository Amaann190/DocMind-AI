<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <script>
      // Apply the preference before the page paints, including on reload.
      let theme = matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
      try {
        const saved = localStorage.getItem("docmind-theme");
        if (saved === "dark" || saved === "light") theme = saved;
      } catch {}
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    </script>
    <meta
      name="description"
      content="A calmer place to read, connect and understand your documents."
    />
    <title>DocMind — Your thinking space</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
